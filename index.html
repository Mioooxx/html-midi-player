<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>HTML MIDI Player Test</title>

    <script src="https://cdn.jsdelivr.net/combine/npm/tone@14.7.58,npm/@magenta/music@1.22.0/es6/core.js"></script>
    <script src="./dist/midi-player.min.js"></script>

    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      .player-section {
        margin-bottom: 40px;
        border: 1px solid #ccc;
        padding: 20px;
        border-radius: 5px;
      }
      h2 {
        margin-top: 0;
      }
    </style>
  </head>
  <body>
    <h1>MIDI Player Test</h1>

    <div class="player-section">
      <h2>Drums</h2>
      <midi-player
        src="./drums.mid"
        sound-font
        visualizer="#drumsVisualizer">
      </midi-player>
      <midi-visualizer type="piano-roll" id="drumsVisualizer"></midi-visualizer>
    </div>

    <div class="player-section">
      <h2>Vocal</h2>
      <midi-player
        src="./vocal.mid"
        sound-font
        visualizer="#vocalVisualizer">
      </midi-player>
      <midi-visualizer type="piano-roll" id="vocalVisualizer"></midi-visualizer>
    </div>

    <div class="player-section">
      <h2>Guitar</h2>
      <midi-player
        src="./guitar.mid"
        sound-font="https://storage.googleapis.com/magentadata/js/soundfonts/sgm_plus"
        visualizer="#guitarVisualizer">
      </midi-player>
      <midi-visualizer type="piano-roll" id="guitarVisualizer"></midi-visualizer>
    </div>

    <script>
      window.addEventListener('DOMContentLoaded', function() {
        for (const player of document.querySelectorAll('midi-player')) {
          for (const event of ['load', 'start', 'stop', 'loop']) {
            player.addEventListener(event, (e) => {
              console.log(`Player event: ${event}`, e);
            });
          }
        }
      });
    </script>
  </body>
</html>
